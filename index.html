<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTCR — Seguimiento Exenciones Fiscales</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1117;
  --surface: #161b22;
  --surface-2: #1c2333;
  --surface-3: #242d3d;
  --border: #2a3444;
  --border-light: #354158;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --text-dim: #6a7585;
  --accent: #c97a3a;
  --accent-light: #e09050;
  --accent-bg: rgba(201,122,58,0.12);
  --green: #2ea043;
  --green-bg: rgba(46,160,67,0.15);
  --green-text: #56d364;
  --yellow: #d29922;
  --yellow-bg: rgba(210,153,34,0.15);
  --yellow-text: #e3b341;
  --orange: #db6d28;
  --orange-bg: rgba(219,109,40,0.15);
  --orange-text: #f0883e;
  --red: #f85149;
  --red-bg: rgba(248,81,73,0.15);
  --red-text: #ff7b72;
  --blue: #388bfd;
  --blue-bg: rgba(56,139,253,0.12);
  --blue-text: #58a6ff;
  --purple: #a371f7;
  --purple-bg: rgba(163,113,247,0.12);
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
  --font: 'DM Sans', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --transition: 0.2s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* LAYOUT */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 240px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 0;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  transition: transform var(--transition);
}

.sidebar-header {
  padding: 20px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #fff;
}

.sidebar-logo-text {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
}

.sidebar-logo-text small {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 400;
  display: block;
  margin-top: 2px;
}

.sidebar-nav {
  padding: 12px 8px;
  flex: 1;
}

.nav-section {
  margin-bottom: 16px;
}

.nav-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-dim);
  padding: 4px 12px 8px;
  font-weight: 600;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--transition);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-bg); color: var(--accent-light); }

.nav-item svg {
  width: 16px; height: 16px;
  flex-shrink: 0;
  opacity: 0.7;
}
.nav-item.active svg { opacity: 1; }

.main {
  margin-left: 240px;
  flex: 1;
  min-height: 100vh;
}

.topbar {
  height: 52px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar-title {
  font-size: 14px;
  font-weight: 600;
}

.topbar-actions {
  display: flex; align-items: center; gap: 12px;
}

.content {
  padding: 24px;
}

/* KPI CARDS */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}

.kpi-card.accent::before { background: var(--accent); }
.kpi-card.green::before { background: var(--green); }
.kpi-card.blue::before { background: var(--blue); }
.kpi-card.yellow::before { background: var(--yellow); }
.kpi-card.red::before { background: var(--red); }
.kpi-card.purple::before { background: var(--purple); }

.kpi-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  margin-bottom: 6px;
  font-weight: 500;
}

.kpi-value {
  font-size: 22px;
  font-weight: 700;
  font-family: var(--mono);
  line-height: 1;
}

.kpi-sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}

/* FILTERS BAR */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 4px;
}

.filter-label {
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-right: 2px;
}

select, input[type="text"], input[type="number"], input[type="date"], textarea {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 6px 10px;
  outline: none;
  transition: border-color var(--transition);
}

select:focus, input:focus, textarea:focus {
  border-color: var(--accent);
}

select { padding-right: 28px; cursor: pointer; }

.search-input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px 6px 32px;
  color: var(--text);
  font-size: 13px;
  width: 220px;
  outline: none;
  font-family: var(--font);
  position: relative;
}

.search-wrapper {
  position: relative;
}

.search-wrapper svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px;
  color: var(--text-dim);
  pointer-events: none;
}

/* TABLE */
.table-container {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.table-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.table-count {
  font-size: 11px;
  background: var(--surface-3);
  padding: 2px 8px;
  border-radius: 10px;
  color: var(--text-muted);
  font-family: var(--mono);
}

.table-scroll {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead {
  background: var(--surface-2);
}

th {
  text-align: left;
  padding: 10px 12px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  font-weight: 600;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}

th:hover { color: var(--text); }

td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

tr:last-child td { border-bottom: none; }

tr:hover td {
  background: rgba(255,255,255,0.02);
}

.table-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
}

/* STATUS BADGE */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.status-badge .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-aprobado { background: var(--green-bg); color: var(--green-text); }
.status-aprobado .dot { background: var(--green); }

.status-sometido { background: var(--blue-bg); color: var(--blue-text); }
.status-sometido .dot { background: var(--blue); }

.status-pendiente { background: var(--yellow-bg); color: var(--yellow-text); }
.status-pendiente .dot { background: var(--yellow); }

.status-rechazado { background: var(--red-bg); color: var(--red-text); }
.status-rechazado .dot { background: var(--red); }

.status-resometido { background: var(--purple-bg); color: var(--purple); }
.status-resometido .dot { background: var(--purple); }

.status-borrador { background: rgba(139,148,158,0.12); color: var(--text-muted); }
.status-borrador .dot { background: var(--text-dim); }

.status-rechazado-def { background: var(--red-bg); color: var(--red-text); }
.status-rechazado-def .dot { background: var(--red); }

.status-exonerado { background: var(--green-bg); color: var(--green-text); }
.status-exonerado .dot { background: var(--green); }

/* DAYS BADGE */
.days-badge {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
}

.days-ok { background: var(--green-bg); color: var(--green-text); }
.days-warn { background: var(--yellow-bg); color: var(--yellow-text); }
.days-danger { background: var(--orange-bg); color: var(--orange-text); }
.days-critical { background: var(--red-bg); color: var(--red-text); }

/* MONEY */
.money {
  font-family: var(--mono);
  font-size: 12px;
  text-align: right;
  font-weight: 500;
}

.money-header { text-align: right; }

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition);
}

.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-light); }

.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border);
}
.btn-secondary:hover { background: var(--surface-3); }

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  padding: 6px 8px;
}
.btn-ghost:hover { color: var(--text); background: var(--surface-2); }

.btn-sm {
  padding: 4px 10px;
  font-size: 12px;
}

.btn-danger {
  background: var(--red-bg);
  color: var(--red-text);
  border-color: rgba(248,81,73,0.3);
}
.btn-danger:hover { background: rgba(248,81,73,0.25); }

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 60px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 580px;
  max-width: 95vw;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(-10px);
  transition: transform 0.2s;
}

.modal-overlay.active .modal {
  transform: translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.modal-title {
  font-size: 15px;
  font-weight: 600;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
}
.modal-close:hover { color: var(--text); background: var(--surface-2); }

.modal-body {
  padding: 20px;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 20px;
  border-top: 1px solid var(--border);
}

/* FORM */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.form-group.full { grid-column: 1 / -1; }

.form-group label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  font-weight: 600;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
}

textarea { min-height: 60px; resize: vertical; }

/* CHARTS ROW */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
}

.chart-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.chart-bar-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chart-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chart-bar-label {
  font-size: 11px;
  color: var(--text-muted);
  width: 100px;
  text-align: right;
  flex-shrink: 0;
}

.chart-bar-track {
  flex: 1;
  height: 20px;
  background: var(--surface-2);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.chart-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
  min-width: 2px;
}

.chart-bar-value {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-muted);
  width: 90px;
  text-align: right;
  flex-shrink: 0;
}

/* PIE CHART (CSS) */
.pie-container {
  display: flex;
  align-items: center;
  gap: 20px;
}

.pie-svg {
  width: 120px; height: 120px;
  flex-shrink: 0;
}

.pie-legend {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.pie-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
}

.pie-legend-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

.pie-legend-value {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  margin-left: auto;
}

/* SECTIONS */
.section-hidden { display: none; }

/* PROVEEDOR TAG */
.provider-tag {
  font-size: 12px;
  font-weight: 500;
}

/* EDIT/ACTION LINKS */
.action-link {
  font-size: 12px;
  color: var(--blue-text);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font);
  padding: 2px 4px;
  border-radius: 3px;
}
.action-link:hover { background: var(--blue-bg); }

/* NUMBER CELL */
.num-cell {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}

/* TOTALS ROW */
tr.totals-row td {
  background: var(--surface-2);
  font-weight: 700;
  border-top: 2px solid var(--accent);
  color: var(--accent-light);
}

/* TOOLTIP */
.tooltip-wrapper {
  position: relative;
}

.comment-icon {
  width: 14px; height: 14px;
  color: var(--text-dim);
  cursor: pointer;
}
.comment-icon:hover { color: var(--accent-light); }

/* Export button */
.btn-export svg { width: 14px; height: 14px; }

/* Tab-like nav for dashboard subsections */
.tab-row {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.tab-item {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  background: none;
  border-top: none; border-left: none; border-right: none;
  font-family: var(--font);
}

.tab-item:hover { color: var(--text); }
.tab-item.active {
  color: var(--accent-light);
  border-bottom-color: var(--accent);
}

/* Scroll indicator for table */
.table-scroll::-webkit-scrollbar {
  height: 6px;
}
.table-scroll::-webkit-scrollbar-track {
  background: var(--surface-2);
}
.table-scroll::-webkit-scrollbar-thumb {
  background: var(--border-light);
  border-radius: 3px;
}

/* ALERT PANEL */
.alert-panel {
  margin-bottom: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface);
}

.alert-panel-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 600;
}

.alert-panel-header svg {
  width: 16px; height: 16px;
  color: var(--orange-text);
}

.alert-panel-body {
  padding: 0;
}

.alert-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  transition: background var(--transition);
}

.alert-row:last-child { border-bottom: none; }
.alert-row:hover { background: rgba(255,255,255,0.02); }

.alert-icon {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
}

.alert-icon.urgent {
  background: var(--red-bg);
  color: var(--red-text);
}

.alert-icon.warning {
  background: var(--orange-bg);
  color: var(--orange-text);
}

.alert-icon.expired {
  background: var(--red-bg);
  color: var(--red-text);
}

.alert-info {
  flex: 1;
  min-width: 0;
}

.alert-title {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.alert-sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 1px;
}

.alert-days {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
  padding: 3px 10px;
  border-radius: 6px;
}

.alert-days.urgent {
  background: var(--red-bg);
  color: var(--red-text);
}

.alert-days.warning {
  background: var(--orange-bg);
  color: var(--orange-text);
}

.alert-days.expired {
  background: var(--red-bg);
  color: var(--red-text);
}

.alert-empty {
  padding: 20px 16px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
}

.alert-action {
  font-size: 11px;
  color: var(--blue-text);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font);
  padding: 3px 8px;
  border-radius: 4px;
  flex-shrink: 0;
  font-weight: 500;
}
.alert-action:hover { background: var(--blue-bg); }

/* PROTECTED BADGE */
.protected-badge {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--yellow-text);
  background: var(--yellow-bg);
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 600;
}

/* VIGENCIA BADGE - estado que dispara conteo de 6 meses */
.vigencia-badge {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent-light);
  background: var(--accent-bg);
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 600;
  border: 1px solid rgba(201,122,58,0.3);
}

/* VIGENCIA BAR */
.vigencia-bar {
  width: 60px;
  height: 6px;
  background: var(--surface-3);
  border-radius: 3px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  margin-right: 6px;
}

.vigencia-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}

/* Fade-in animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.content > * {
  animation: fadeIn 0.3s ease both;
}

.content > *:nth-child(2) { animation-delay: 0.05s; }
.content > *:nth-child(3) { animation-delay: 0.1s; }
.content > *:nth-child(4) { animation-delay: 0.15s; }
</style>
</head>

const daysBetween = (d1, d2) => {
  const a = new Date(d1), b = new Date(d2);
  return Math.floor((b - a) / 86400000);
};

const today = new Date().toISOString().split('T')[0];

const diasEnEstado = (sol) => {
  const from = sol.fechaSolicitud;
  if (!from) return 0;
  const to = sol.fechaAprobacion || today;
  return daysBetween(from, to);
};

const fechaVencimiento = (sol) => {
  if (!disparaVigencia(sol.estado)) return null;
  if (!sol.fechaAprobacion) return null;
  const d = new Date(sol.fechaAprobacion);
  d.setMonth(d.getMonth() + VIGENCIA_MESES);
  return d.toISOString().split('T')[0];
};

const diasParaVencer = (sol) => {
  const venc = fechaVencimiento(sol);
  if (!venc) return null;
  return daysBetween(today, venc);
};

const getDaysClass = (dias) => {
  if (dias === null) return '';
  if (dias < 0) return 'days-critical';
  if (dias < 15) return 'days-danger';
  if (dias < 30) return 'days-warn';
  return 'days-ok';
};

const getStatusClass = (estado) => ESTADO_CSS[estado] || 'status-borrador';

const getMes = (fecha) => {
  if (!fecha) return '';
  return fecha.substring(0, 7);
};

const getMesLabel = (fecha) => {
  if (!fecha) return '';
  const d = new Date(fecha + 'T00:00:00');
  return d.toLocaleDateString('es-DO', { month: 'short', year: 'numeric' });
};

// ===================== FILTER =====================
function applyFilters(data) {
  return data.filter(s => {
    if (filters.estado && s.estado !== filters.estado) return false;
    if (filters.depto && s.depto !== filters.depto) return false;
    if (filters.tipo && s.tipo !== filters.tipo) return false;
    if (filters.via && s.via !== filters.via) return false;
    if (filters.mes && getMes(s.fechaSolicitud) !== filters.mes) return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      const searchable = (s.proveedor + s.descripcion + s.noSolicitud + s.comentarios).toLowerCase();
      if (!searchable.includes(q)) return false;
    }
    return true;
  });
}

// ===================== RENDER CHARTS =====================
function renderCharts(data) {
  const byEstado = {};
  const byDepto = {};
  ESTADOS.forEach(e => byEstado[e] = 0);
  DEPARTAMENTOS.forEach(d => byDepto[d] = 0);

  data.forEach(s => {
    if (byEstado[s.estado] !== undefined) byEstado[s.estado] += (s.itbisDOP || 0);
    if (byDepto[s.depto] !== undefined) byDepto[s.depto] += (s.itbisDOP || 0);
  });

  const maxEstado = Math.max(...Object.values(byEstado), 1);
  const maxDepto = Math.max(...Object.values(byDepto), 1);

  const statusColors = {
    'Aprobado': 'var(--green)',
    'Exonerado': 'var(--green)',
    'Sometido en espera DGII': 'var(--blue)',
    'Sometido en espera Min Hacienda': '#6a9ff7',
    'Re-sometido DGII': 'var(--purple)',
    'Pendiente de someter': 'var(--yellow)',
    'En revisión': '#e0a030',
    'Rechazado DGII': 'var(--orange)',
    'Rechazado definitivo': 'var(--red)',
  };

  // Pie data
  const pieData = Object.entries(byEstado).filter(([,v]) => v > 0);
  const pieTotal = pieData.reduce((a, [, v]) => a + v, 0) || 1;
  const pieColors = pieData.map(([k]) => statusColors[k] || 'var(--text-dim)');

  let cumAngle = 0;
  const pieSlices = pieData.map(([k, v], i) => {
    const pct = v / pieTotal;
    const angle = pct * 360;
    const startAngle = cumAngle;
    cumAngle += angle;
    const large = angle > 180 ? 1 : 0;
    const r = 50;
    const cx = 60, cy = 60;
    const rad1 = (startAngle - 90) * Math.PI / 180;
    const rad2 = (startAngle + angle - 90) * Math.PI / 180;
    const x1 = cx + r * Math.cos(rad1);
    const y1 = cy + r * Math.sin(rad1);
    const x2 = cx + r * Math.cos(rad2);
    const y2 = cy + r * Math.sin(rad2);
    if (pct >= 0.999) {
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${pieColors[i]}" opacity="0.85"/>`;
    }
    return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${pieColors[i]}" opacity="0.85"/>`;
  }).join('');

  const pieLegend = pieData.map(([k, v], i) => `
    <div class="pie-legend-item">
      <div class="pie-legend-dot" style="background:${pieColors[i]}"></div>
      ${k.replace('Sometido en espera ', 'Esp. ')}
      <span class="pie-legend-value">${Math.round(v / pieTotal * 100)}%</span>
    </div>
  `).join('');

  // Bar chart for departamentos
  const deptoEntries = Object.entries(byDepto).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  const deptoColors = ['var(--accent)', 'var(--blue)', 'var(--green)', 'var(--purple)', 'var(--yellow)', 'var(--orange)', 'var(--red)'];
  const deptoBars = deptoEntries.map(([k, v], i) => `
    <div class="chart-bar-row">
      <div class="chart-bar-label">${k}</div>
      <div class="chart-bar-track">
        <div class="chart-bar-fill" style="width:${(v/maxDepto*100).toFixed(1)}%;background:${deptoColors[i % deptoColors.length]}"></div>
      </div>
      <div class="chart-bar-value">${fmt(v)}</div>
    </div>
  `).join('');

  // Via chart
  const byVia = {};
  VIAS.forEach(v => byVia[v] = { total: 0, count: 0 });
  data.forEach(s => {
    if (byVia[s.via]) {
      byVia[s.via].total += (s.itbisDOP || 0);
      byVia[s.via].count++;
    }
  });

  const viaBars = Object.entries(byVia).map(([k, v]) => `
    <div class="chart-bar-row">
      <div class="chart-bar-label" style="width:160px">${k.split('(')[0].trim()}</div>
      <div class="chart-bar-track">
        <div class="chart-bar-fill" style="width:${maxDepto > 0 ? (v.total/maxDepto*100).toFixed(1) : 0}%;background:var(--blue)"></div>
      </div>
      <div class="chart-bar-value">${fmt(v.total)} <span style="color:var(--text-dim)">(${v.count})</span></div>
    </div>
  `).join('');

  document.getElementById('chartsGrid').innerHTML = `
    <div class="chart-card">
      <div class="chart-title">Distribución Impuesto por Estado</div>
      <div class="pie-container">
        <svg class="pie-svg" viewBox="0 0 120 120">${pieSlices}</svg>
        <div class="pie-legend">${pieLegend}</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Impuesto por Departamento</div>
      <div class="chart-bar-container">${deptoBars}</div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Montos por Vía de Sometimiento</div>
      <div class="chart-bar-container">${viaBars}</div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Resumen Rápido</div>
      <div style="display:flex;flex-direction:column;gap:10px;font-size:13px">
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Tasa cambio ref.</span><span style="font-family:var(--mono)">60.84 DOP/USD</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Solicitudes este mes</span><span style="font-family:var(--mono)">${data.filter(s => getMes(s.fechaSolicitud) === getMes(today)).length}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">% Aprobado vs Solicitado</span><span style="font-family:var(--mono);color:var(--green-text)">${data.reduce((a,s)=>a+s.itbisDOP,0) > 0 ? Math.round(data.filter(s=>s.estado==='Aprobado'||s.estado==='Exonerado').reduce((a,s)=>a+s.itbisDOP,0) / data.reduce((a,s)=>a+s.itbisDOP,0) * 100) : 0}%</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Con contrato</span><span style="font-family:var(--mono)">${data.filter(s=>s.tipo==='Con contrato').length}</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Compras únicas</span><span style="font-family:var(--mono)">${data.filter(s=>s.tipo.startsWith('Compras')).length}</span></div>
      </div>
    </div>
  `;
}

  const rows = data.map(s => {
    const dias = diasEnEstado(s);
    const venc = fechaVencimiento(s);
    const diasV = diasParaVencer(s);
    const isAprobado = disparaVigencia(s.estado);

    // Vigencia cell
    let vigenciaCell = '<td style="text-align:center;font-size:12px">—</td>';
    if (isAprobado && venc) {
      const totalDias = VIGENCIA_MESES * 30;
      const diasUsados = totalDias - (diasV || 0);
      const pctUsado = Math.min(100, Math.max(0, (diasUsados / totalDias) * 100));
      let barColor = 'var(--green)';
      let textColor = 'var(--green-text)';

      if (diasV < 0) {

// ===================== RENDER ALERTS =====================
function renderAlerts() {
  const panel = document.getElementById('alertPanel');
  if (!panel) return;

  // Get all approved/exonerado with fecha de aprobación
  const vigentes = solicitudes.filter(s =>
    disparaVigencia(s.estado) && s.fechaAprobacion
  );

  // Calculate days remaining for each
  const alertItems = [];

  vigentes.forEach(s => {
    const diasRestantes = diasParaVencer(s);
    if (diasRestantes === null) return;

    const vencimiento = fechaVencimiento(s);
    let nivel = null;

    if (diasRestantes < 0) {
      nivel = 'expired';
    } else if (diasRestantes <= ALERTA_URGENTE_DIAS) {
      nivel = 'urgent';
    } else if (diasRestantes <= ALERTA_ADVERTENCIA_DIAS) {
      nivel = 'warning';
    }

    if (nivel) {
      alertItems.push({ sol: s, diasRestantes, vencimiento, nivel });
    }
  });

  // Sort: expired first, then urgent, then warning; within each by days ascending
  const nivelOrder = { expired: 0, urgent: 1, warning: 2 };
  alertItems.sort((a, b) => {
    if (nivelOrder[a.nivel] !== nivelOrder[b.nivel]) return nivelOrder[a.nivel] - nivelOrder[b.nivel];
    return a.diasRestantes - b.diasRestantes;
  });

  if (alertItems.length === 0) {
    panel.innerHTML = '';
    return;
  }

  const expiredCount = alertItems.filter(a => a.nivel === 'expired').length;
  const urgentCount = alertItems.filter(a => a.nivel === 'urgent').length;
  const warningCount = alertItems.filter(a => a.nivel === 'warning').length;

  const headerParts = [];
  if (expiredCount > 0) headerParts.push(`${expiredCount} vencida${expiredCount > 1 ? 's' : ''}`);
  if (urgentCount > 0) headerParts.push(`${urgentCount} urgente${urgentCount > 1 ? 's' : ''}`);
  if (warningCount > 0) headerParts.push(`${warningCount} próxima${warningCount > 1 ? 's' : ''}`);

  const rows = alertItems.map(a => {
    const icon = a.nivel === 'expired' ? '⛔' : a.nivel === 'urgent' ? '🔴' : '🟠';
    const diasLabel = a.nivel === 'expired'
      ? `Venció hace ${Math.abs(a.diasRestantes)}d`
      : `${a.diasRestantes}d restantes`;
    const accion = a.sol.tipo === 'Con contrato'
      ? 'Preparar nueva proforma'
      : 'Verificar vigencia';

    // Vigencia bar: percentage of 6 months consumed
    const totalDias = VIGENCIA_MESES * 30;
    const diasUsados = totalDias - a.diasRestantes;
    const pctUsado = Math.min(100, Math.max(0, (diasUsados / totalDias) * 100));
    const barColor = a.nivel === 'expired' ? 'var(--red)' : a.nivel === 'urgent' ? 'var(--red)' : 'var(--orange)';

    return `
      <div class="alert-row">
        <div class="alert-icon ${a.nivel}">${icon}</div>
        <div class="alert-info">
          <div class="alert-title">${a.sol.proveedor} — ${a.sol.descripcion}</div>
          <div class="alert-sub">
            No. ${a.sol.noSolicitud || a.sol.id} · Vence: ${a.vencimiento} ·
            <span class="vigencia-bar"><span class="vigencia-bar-fill" style="width:${pctUsado}%;background:${barColor}"></span></span>
            ${Math.round(pctUsado)}% consumido
          </div>
        </div>
        <span class="alert-days ${a.nivel}">${diasLabel}</span>
        <button class="alert-action" onclick="openEditSolicitud('${a.sol.id}')">${accion}</button>
      </div>
    `;
  }).join('');

  panel.innerHTML = `
    <div class="alert-panel">
      <div class="alert-panel-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Alertas de Vigencia — ${headerParts.join(' · ')}
        <span style="font-size:11px;color:var(--text-dim);font-weight:400;margin-left:8px">(Exenciones aprobadas tienen vigencia de ${VIGENCIA_MESES} meses)</span>
      </div>
      <div class="alert-panel-body">
        ${rows}
      </div>
    </div>
  `;
}

function renderCatalogos() {
  const catalogs = [
    { key: 'DEPARTAMENTOS', label: 'Departamentos', ref: () => DEPARTAMENTOS, set: v => DEPARTAMENTOS = v, field: 'depto' },
    { key: 'TIPOS_COMPRA', label: 'Tipos de Compra', ref: () => TIPOS_COMPRA, set: v => TIPOS_COMPRA = v, field: 'tipo' },
    { key: 'ESTADOS', label: 'Estados de Solicitud', ref: () => ESTADOS, set: v => ESTADOS = v, field: 'estado' },
    { key: 'VIAS', label: 'Vías de Sometimiento', ref: () => VIAS, set: v => VIAS = v, field: 'via' },
  ];

  catalogs.forEach(cat => {
    const container = document.getElementById({
      'DEPARTAMENTOS': 'catDeptos',
      'TIPOS_COMPRA': 'catTipos',
      'ESTADOS': 'catEstados',
      'VIAS': 'catVias'
    }[cat.key]);

    const items = cat.ref();
    const usedCounts = {};
    items.forEach(item => {
      usedCounts[item] = solicitudes.filter(s => s[cat.field] === item).length;
    });

    const isEstado = cat.key === 'ESTADOS';

    container.innerHTML = items.map((item, i) => {
      const isVigencia = isEstado && disparaVigencia(item);
      return `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)" data-cat="${cat.key}" data-idx="${i}">
        ${isEstado ? `<span class="status-badge ${getStatusClass(item)}"><span class="dot"></span></span>` : ''}
        <span class="cat-item-name" style="flex:1;font-size:13px">${item}</span>
        ${isVigencia ? `<span class="vigencia-badge" title="Este estado dispara el conteo de vigencia de ${VIGENCIA_MESES} meses">⚡ Dispara vigencia</span>` : ''}
        ${isEstado && !isVigencia ? `<button class="btn-ghost btn-sm" style="padding:2px 6px;font-size:11px;cursor:pointer;background:none;border:none;color:var(--text-dim)" onclick="toggleVigencia('${item}')" title="Marcar como disparador de vigencia">⚡</button>` : ''}
        ${isVigencia ? `<button class="btn-ghost btn-sm" style="padding:2px 6px;font-size:11px;cursor:pointer;background:none;border:none;color:var(--yellow-text)" onclick="toggleVigencia('${item}')" title="Quitar como disparador de vigencia">✕⚡</button>` : ''}
        <span style="font-size:11px;color:var(--text-dim);font-family:var(--mono)">${usedCounts[item] || 0}</span>
        <button class="btn-ghost btn-sm" style="padding:2px 6px;font-size:11px;cursor:pointer;background:none;border:none;color:var(--blue-text)" onclick="renameCatItem('${cat.key}',${i})">Renombrar</button>
        ${usedCounts[item] === 0 ? `<button class="btn-ghost btn-sm" style="padding:2px 6px;font-size:11px;cursor:pointer;background:none;border:none;color:var(--red-text)" onclick="deleteCatItem('${cat.key}',${i})">Eliminar</button>` : ''}
      </div>`;
    }).join('') + `
      <div style="display:flex;align-items:center;gap:6px;padding:8px 0">
        <input type="text" id="newCat_${cat.key}" placeholder="Agregar nuevo..." style="flex:1;padding:5px 8px;font-size:12px">
        <button class="btn btn-primary btn-sm" style="padding:4px 10px;font-size:11px" onclick="addCatItem('${cat.key}')">+ Agregar</button>
      </div>
    `;
  });
}

function toggleVigencia(estado) {
  if (ESTADOS_VIGENCIA.includes(estado)) {
    if (ESTADOS_VIGENCIA.length === 1) {
      alert('Debe existir al menos un estado que dispare vigencia.\nPrimero asigna esta condición a otro estado antes de quitarla.');
      return;
    }
    if (!confirm(`¿Quitar "${estado}" como disparador de vigencia?\n\nLas solicitudes con este estado dejarán de calcular vencimiento de ${VIGENCIA_MESES} meses.`)) return;
    ESTADOS_VIGENCIA = ESTADOS_VIGENCIA.filter(e => e !== estado);
  } else {
    if (!confirm(`¿Marcar "${estado}" como disparador de vigencia?\n\nLas solicitudes con este estado iniciarán el conteo de vencimiento de ${VIGENCIA_MESES} meses desde la fecha de aprobación.`)) return;
    ESTADOS_VIGENCIA.push(estado);
  }
  renderCatalogos();
  renderAll();
}

function addCatItem(catKey) {
  const input = document.getElementById('newCat_' + catKey);
  const val = input.value.trim();
  if (!val) return;

  const arr = { DEPARTAMENTOS, TIPOS_COMPRA, ESTADOS, VIAS }[catKey];
  if (arr.includes(val)) { alert('Ya existe ese valor.'); return; }
  arr.push(val);
  input.value = '';
  renderCatalogos();
}

function renameCatItem(catKey, idx) {
  const arr = { DEPARTAMENTOS, TIPOS_COMPRA, ESTADOS, VIAS }[catKey];
  const oldVal = arr[idx];
  const fieldMap = { DEPARTAMENTOS: 'depto', TIPOS_COMPRA: 'tipo', ESTADOS: 'estado', VIAS: 'via' };
  const field = fieldMap[catKey];

  const wasVigencia = catKey === 'ESTADOS' && disparaVigencia(oldVal);
  const extraInfo = wasVigencia
    ? `\n\nNota: "${oldVal}" dispara la vigencia de ${VIGENCIA_MESES} meses.\nEsa condición se mantendrá con el nuevo nombre.`
    : '';

  const newVal = prompt(`Renombrar "${oldVal}" a:${extraInfo}`, oldVal);
  if (!newVal || newVal.trim() === '' || newVal.trim() === oldVal) return;
  const trimmed = newVal.trim();

  if (arr.includes(trimmed)) { alert('Ya existe ese valor.'); return; }

  arr[idx] = trimmed;

  // Si el estado renombrado disparaba vigencia, actualizar la referencia
  if (wasVigencia) {
    const vIdx = ESTADOS_VIGENCIA.indexOf(oldVal);
    if (vIdx >= 0) ESTADOS_VIGENCIA[vIdx] = trimmed;
  }

  // Update all solicitudes that use the old value
  solicitudes.forEach(s => {
    if (s[field] === oldVal) s[field] = trimmed;
  });

  renderCatalogos();
  renderAll();
}

function deleteCatItem(catKey, idx) {
  const arr = { DEPARTAMENTOS, TIPOS_COMPRA, ESTADOS, VIAS }[catKey];
  const val = arr[idx];
  const fieldMap = { DEPARTAMENTOS: 'depto', TIPOS_COMPRA: 'tipo', ESTADOS: 'estado', VIAS: 'via' };
  const field = fieldMap[catKey];

  // Si es el último estado que dispara vigencia, no permitir eliminar
  if (catKey === 'ESTADOS' && disparaVigencia(val) && ESTADOS_VIGENCIA.length === 1) {
    alert(`"${val}" es actualmente el único estado que dispara la vigencia de ${VIGENCIA_MESES} meses.\n\nPrimero marca otro estado como disparador de vigencia antes de eliminar este.`);
    return;
  }

  const usedCount = solicitudes.filter(s => s[field] === val).length;
  if (usedCount > 0) {
    alert(`No se puede eliminar "${val}" porque está en uso en ${usedCount} solicitud(es).`);
    return;
  }

  if (!confirm(`¿Eliminar "${val}" del catálogo?`)) return;
  arr.splice(idx, 1);

  // Limpiar de ESTADOS_VIGENCIA si aplica
  if (catKey === 'ESTADOS') {
    ESTADOS_VIGENCIA = ESTADOS_VIGENCIA.filter(e => e !== val);
  }

  renderCatalogos();
}

function saveSolicitud(editId) {
  const moneda = document.getElementById('fMoneda').value;
  const tasa = parseFloat(document.getElementById('fTasa').value) || 1;
  const montoFact = parseFloat(document.getElementById('fMontoFact').value) || 0;
  const montoDOP = moneda === 'USD' ? montoFact * tasa : montoFact;

  const sol = {
    id: editId || document.getElementById('fNoSol').value || 'SOL-' + Date.now(),
    noSolicitud: document.getElementById('fNoSol').value,
    proveedor: document.getElementById('fProveedor').value,
    descripcion: document.getElementById('fDesc').value,
    tipo: document.getElementById('fTipo').value,
    depto: document.getElementById('fDepto').value,
    via: document.getElementById('fVia').value,
    estado: document.getElementById('fEstado').value,
    moneda,
    tasaCambio: tasa,
    montoFactura: montoFact,
    montoDOP,
    itbisDOP: parseFloat(document.getElementById('fItbis').value) || 0,
    fechaSolicitud: document.getElementById('fFechaSol').value,
    fechaAprobacion: document.getElementById('fFechaAprob').value,
    comentarios: document.getElementById('fComentarios').value,
  };

  if (editId) {
    const idx = solicitudes.findIndex(s => s.id === editId);
    if (idx >= 0) solicitudes[idx] = sol;
  } else {
    solicitudes.push(sol);
  }

  closeModal();
  renderAll();
}

    document.getElementById('fDesc').value = s.descripcion;
    document.getElementById('fTipo').value = s.tipo;
    document.getElementById('fDepto').value = s.depto;
    document.getElementById('fVia').value = s.via;
    document.getElementById('fEstado').value = s.estado;
    document.getElementById('fMoneda').value = s.moneda;
    document.getElementById('fTasa').value = s.tasaCambio;
    document.getElementById('fMontoFact').value = s.montoFactura;

// ===================== EXPORT =====================
function exportToCSV() {
  const data = applyFilters(solicitudes);

  if (data.length === 0) {
    alert('No hay solicitudes que coincidan con los filtros actuales.');
    return;
  }

  const headers = ['No. Solicitud', 'Proveedor', 'Descripción', 'Tipo', 'Departamento', 'Estado', 'Vía', 'F. Solicitud', 'F. Aprobación', 'Días', 'Moneda', 'Monto Factura', 'Monto DOP', 'Impuesto a Exonerar (DOP)', 'Comentarios'];
  const rows = data.map(s => [
    s.noSolicitud || s.id, s.proveedor, s.descripcion, s.tipo, s.depto, s.estado, s.via,
    s.fechaSolicitud, s.fechaAprobacion || '', diasEnEstado(s),
    s.moneda, s.montoFactura, s.montoDOP, s.itbisDOP, s.comentarios
  ]);

  // Resumen de filtros activos para incluir en el nombre del archivo
  const activeFilters = [];
  if (filters.estado) activeFilters.push(filters.estado.replace(/\s+/g, '_'));
  if (filters.depto) activeFilters.push(filters.depto);
  if (filters.tipo) activeFilters.push(filters.tipo.replace(/\s+/g, '_'));
  if (filters.via) activeFilters.push(filters.via.split('(')[0].trim().replace(/\s+/g, '_'));
  if (filters.mes) activeFilters.push(filters.mes);
  const filterTag = activeFilters.length > 0 ? '_' + activeFilters.join('-') : '_completo';

  let csv = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => {
    csv += r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `exenciones_ctcr_${today}${filterTag}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ===================== NAVIGATION =====================
function showSection(section) {
  currentSection = section;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.currentTarget.classList.add('active');

  document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('section-hidden'));
  document.getElementById('section-' + section).classList.remove('section-hidden');

  const titles = {
    dashboard: 'Dashboard — Resumen General',
    solicitudes: 'Solicitudes de Exención',
    contratos: 'Contratos',
    proveedores: 'Proveedores',
    catalogos: 'Catálogos del Sistema'
  };
  document.getElementById('topbarTitle').textContent = titles[section] || '';

  renderAll();
}

// ===================== RENDER ALL =====================
function renderAll() {
  const filtered = applyFilters(solicitudes);

  if (currentSection === 'dashboard') {
    renderKPIs(filtered);
    renderAlerts();
    renderCharts(filtered);
    renderFilters('dashFilters');
    renderMainTable('dashTable', filtered);
  } else if (currentSection === 'solicitudes') {
    renderFilters('solFilters');
    renderMainTable('solTable', filtered);
  } else if (currentSection === 'contratos') {
    renderContratosTable();
  } else if (currentSection === 'proveedores') {
    renderProveedoresTable();
  } else if (currentSection === 'catalogos') {
    renderCatalogos();
  }
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// ESC to close modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// Init
renderAll();
