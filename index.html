<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTCR — Exenciones Fiscales</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">CR</div>
        <div class="sidebar-logo-text">
          Cabo Rojo
          <small>Exenciones Fiscales</small>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Principal</div>
        <button class="nav-item active" data-section="dashboard" onclick="showSection('dashboard', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-section="solicitudes" onclick="showSection('solicitudes', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Solicitudes
        </button>
        <button class="nav-item" data-section="contratos" onclick="showSection('contratos', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Contratos
        </button>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Maestros</div>
        <button class="nav-item" data-section="proveedores" onclick="showSection('proveedores', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Proveedores
        </button>
        <button class="nav-item" data-section="catalogos" onclick="showSection('catalogos', event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Catálogos
        </button>
      </div>
    </nav>
    <div class="sidebar-footer">
      Corporación Turística<br>Cabo Rojo S.A.
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">

    <!-- TOPBAR -->
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">Dashboard Ejecutivo</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="exportToCSV()" title="Exporta sólo las solicitudes que están visibles con los filtros actuales">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar filtrado
        </button>
        <button class="btn btn-primary btn-sm" onclick="abrirNuevaSolicitud()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nueva Solicitud
        </button>
      </div>
    </header>

    <!-- SECCIONES (cada una con .content-inner que se rellena por JS) -->
    <div id="section-dashboard" class="section">
      <div class="content"><div class="content-inner"></div></div>
    </div>
    <div id="section-solicitudes" class="section section-hidden">
      <div class="content"><div class="content-inner"></div></div>
    </div>
    <div id="section-contratos" class="section section-hidden">
      <div class="content"><div class="content-inner"></div></div>
    </div>
    <div id="section-proveedores" class="section section-hidden">
      <div class="content"><div class="content-inner"></div></div>
    </div>
    <div id="section-catalogos" class="section section-hidden">
      <div class="content"><div class="content-inner"></div></div>
    </div>

  </main>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Nueva Solicitud</div>
      <button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ============ SCRIPTS (orden de dependencia) ============ -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/helpers.js"></script>
<script src="js/catalogos.js"></script>
<script src="js/proveedores.js"></script>
<script src="js/contratos.js"></script>
<script src="js/solicitudes.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>

</body>
</html>
